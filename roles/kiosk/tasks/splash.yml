---
- name: Install framebuffer and Wayland image viewers
  ansible.builtin.apt:
    name:
      - fbi
      - swaybg
      - imagemagick
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  become_user: root

- name: Create splash work directory
  ansible.builtin.file:
    path: /usr/local/share/kiosk
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: root

- name: Copy source splash image from Ansible controller
  ansible.builtin.copy:
    src: "{{ kiosk_splash_image }}"
    dest: /usr/local/share/kiosk/splash-source.png
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  register: kiosk_splash_source

- name: Record splash rotation
  ansible.builtin.copy:
    content: "{{ kiosk_splash_rotation | string }}\n"
    dest: /usr/local/share/kiosk/splash-orientation
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  register: kiosk_splash_orientation_file

- name: Check prepared splash image
  ansible.builtin.stat:
    path: /usr/local/share/kiosk/splash.png
  register: kiosk_splash_prepared

- name: Prepare PNG for framebuffer and Wayland
  ansible.builtin.command:
    argv:
      - convert
      - /usr/local/share/kiosk/splash-source.png
      - -background
      - black
      - -rotate
      - "{{ kiosk_splash_rotation | string }}"
      - /usr/local/share/kiosk/splash.png
  become: true
  become_user: root
  changed_when: true
  when: >-
    kiosk_splash_source.changed or
    kiosk_splash_orientation_file.changed or
    not kiosk_splash_prepared.stat.exists

- name: Install framebuffer splash launcher
  ansible.builtin.copy:
    src: kiosk-splash.sh
    dest: /usr/local/bin/kiosk-splash
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: root

- name: Install framebuffer splash service
  ansible.builtin.copy:
    src: kiosk-splash.service
    dest: /etc/systemd/system/kiosk-splash.service
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  register: kiosk_splash_service_file

- name: Enable framebuffer splash for next boot
  ansible.builtin.systemd_service:
    name: kiosk-splash.service
    enabled: true
    daemon_reload: "{{ kiosk_splash_service_file.changed }}"
  become: true
  become_user: root
